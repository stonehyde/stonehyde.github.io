<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneHyde</title>
  <style>
    :root {
      --bg: #2b2b2b;
      --panel: #353535;
      --text: #ffffff;
      --muted: #cfcfcf;
      --accent: #8ab4f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--panel);
      padding: 48px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #111111;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    @media (max-width: 600px) {
      .container {
        padding: 32px 24px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Hello, I’m StoneHyde</h1>
    <p>
      There may be something here in the future, but for now its blank.
    </p>
  </main>
</body>
</html>
